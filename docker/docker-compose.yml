services:
  postgres:
    image: postgres:16-alpine
    container_name: ce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ce_db}
      POSTGRES_USER: ${DB_USER:-ce_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ce_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ce_user} -d ${DB_NAME:-ce_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: ce-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: controle-estoque
    container_name: ce-app
    restart: unless-stopped
    environment:
      # Dentro da rede do compose o banco se chama "postgres" e atende sempre na 5432
      # (DB_PORT do .env é a porta exposta no computador, não vale aqui)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ce_db}
      DB_USER: ${DB_USER:-ce_user}
      DB_PASSWORD: ${DB_PASSWORD:-ce_password}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data: