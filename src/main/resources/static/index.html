<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Controle de Estoque</title>
  <meta name="description" content="Administração do estoque por lote e dos cadastros da padaria.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b54c8'/%3E%3Cpath d='M8 21h16M9 21c0-6 3-10 7-10s7 4 7 10M13 14l1.5 3M19 14l-1.5 3M16 12v4' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Aplica o tema salvo antes de pintar a página, para não piscar no tema errado
    try {
      var tema = localStorage.getItem("ce.tema");
      if (tema === "dark" || tema === "light") document.documentElement.dataset.theme = tema;
    } catch (e) { /* armazenamento bloqueado: segue o tema do sistema */ }
  </script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <a class="visualmente-oculto" href="#conteudo">Pular para o conteúdo</a>
  <div class="app">
    <nav class="menu" id="menu" aria-label="Menu principal">
      <div class="marca">
        <span class="marca-simbolo" aria-hidden="true">
          <svg class="icone" viewBox="0 0 24 24"><path d="M3 18h18M4.5 18c0-6.2 3.4-10.5 7.5-10.5s7.5 4.3 7.5 10.5M9 11l1.4 3M15 11l-1.4 3M12 9.5V14"/></svg>
        </span>
        <span>
          <span class="marca-nome">Controle de Estoque</span><br>
          <span class="marca-sub">Padaria · administração</span>
        </span>
      </div>
      <div id="menu-links"></div>
      <div class="menu-rodape">
        <span class="status-api" id="status-api" role="status">Verificando a API...</span>
        <button class="btn" type="button" id="botao-tema">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
          <span>Tema escuro</span>
        </button>
      </div>
    </nav>
    <div class="veu-menu" id="veu-menu"></div>

    <div class="principal">
      <header class="topo">
        <button class="btn btn-fantasma btn-icone botao-menu" type="button" id="botao-menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
          <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="topo-trilha">
          <span class="topo-secao" id="topo-secao">Painel</span>
          <span class="topo-titulo" id="topo-titulo">Visão geral</span>
        </div>
      </header>
      <main class="conteudo" id="conteudo" tabindex="-1"></main>
    </div>
  </div>
  <div class="avisos" id="avisos" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px">Esta página precisa do JavaScript ativado no navegador.</p>
  </noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
